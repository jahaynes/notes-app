# One origin for both: the app at /, the API under /api/.
# At the login screen, the server address is notes.johnhaynes.dev/api
#
# Plain http redirects to https. cert-manager's challenge ingress is
# separate and has no redirect, and its longer path wins over these.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: notes-app-https@kubernetescrd
spec:
  tls:
    - hosts:
        - notes.johnhaynes.dev
      secretName: notes-tls
  rules:
    - host: notes.johnhaynes.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: notes-app-https@kubernetescrd,notes-app-api-strip@kubernetescrd
spec:
  tls:
    - hosts:
        - notes.johnhaynes.dev
      secretName: notes-tls
  rules:
    - host: notes.johnhaynes.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
---
# Leaves requests that are already https alone
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# The backend serves its routes from the root
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-strip
spec:
  stripPrefix:
    prefixes:
      - /api
